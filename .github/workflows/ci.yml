name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 地球与太阳系检查及 Pages 构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            integrations/solar-system-atlas/package-lock.json
      - name: 安装两个入口的依赖
        run: |
          npm ci --registry=https://registry.npmjs.org
          npm ci --prefix integrations/solar-system-atlas --registry=https://registry.npmjs.org
      - name: 类型检查和回归验证
        run: |
          npm run typecheck
          npm run typecheck:solar
          npm test
      - name: 构建并验证 Pages 资源包
        run: |
          npm run build:pages
          npm run test:pages
