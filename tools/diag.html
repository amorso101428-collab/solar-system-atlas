<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>atlas env diag</title>
    <style>
      body {
        margin: 0;
        background: #050505;
        color: #e7e1d5;
        font: 16px/1.6 monospace;
        padding: 20px;
      }
      b {
        color: #c58a55;
      }
      #box {
        width: 200px;
        height: 200px;
        background: #c58a55;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <div id="out">measuring…</div>
    <div id="box"></div>
    <script>
      // 只用来回答一个问题：这个浏览器环境认为自己的主指针是什么、视口多大。
      var lines = []
      lines.push('innerWidth x innerHeight: <b>' + window.innerWidth + ' x ' + window.innerHeight + '</b>')
      var vv = window.visualViewport
      lines.push('visualViewport: <b>' + (vv ? Math.round(vv.width) + ' x ' + Math.round(vv.height) : 'none') + '</b>')
      lines.push('devicePixelRatio: <b>' + window.devicePixelRatio + '</b>')
      lines.push('maxTouchPoints: <b>' + (navigator.maxTouchPoints || 0) + '</b>')
      lines.push('pointer: coarse = <b>' + matchMedia('(pointer: coarse)').matches + '</b>')
      lines.push('pointer: fine = <b>' + matchMedia('(pointer: fine)').matches + '</b>')
      lines.push('hover: none = <b>' + matchMedia('(hover: none)').matches + '</b>')
      lines.push('hover: hover = <b>' + matchMedia('(hover: hover)').matches + '</b>')
      lines.push('UA: <b>' + navigator.userAgent + '</b>')
      // 安全区：用一个探针元素把 env(safe-area-inset-*) 量出来（真机上才有值）
      var probe = document.createElement('div')
      probe.style.cssText =
        'position:fixed;left:-100px;top:-100px;padding-top:env(safe-area-inset-top,0px);' +
        'padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px);' +
        'padding-left:env(safe-area-inset-left,0px);'
      document.body.appendChild(probe)
      var cs = getComputedStyle(probe)
      lines.push(
        'safe-area (t/r/b/l): <b>' +
          [cs.paddingTop, cs.paddingRight, cs.paddingBottom, cs.paddingLeft].join(' / ') +
          '</b>'
      )
      probe.remove()
      document.getElementById('out').innerHTML = lines.join('<br>')
    </script>
  </body>
</html>
